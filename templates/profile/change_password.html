{% extends 'base_app.html' %}

{% block title %}Change Password - Kizuna{% endblock %}

{% block content %}
<div class="settings-page">
    <div class="page-header" style="margin-bottom:16px;">
        <a href="{% url 'settings' %}" class="back-btn" title="Back">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12,19 5,12 12,5"/></svg>
        </a>
        <h2>Change Password</h2>
    </div>

    <div class="settings-container" style="max-width:480px;">
        {% if messages %}
        <div class="settings-messages">
            {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">{{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}

        <div class="change-pw-card">
            <form method="post" class="change-pw-form">
                {% csrf_token %}
                <div class="form-group">
                    <label>Current Password</label>
                    <div class="input-wrapper">
                        <input type="password" name="current_password" placeholder="Enter current password" required class="auth-input">
                    </div>
                </div>
                <div class="form-group">
                    <label>New Password</label>
                    <div class="input-wrapper">
                        <input type="password" name="new_password" placeholder="Enter new password" required minlength="8" class="auth-input">
                    </div>
                </div>
                <div class="form-group">
                    <label>Confirm New Password</label>
                    <div class="input-wrapper">
                        <input type="password" name="confirm_password" placeholder="Confirm new password" required minlength="8" class="auth-input">
                    </div>
                </div>
                <button type="submit" class="btn-post" style="width:100%;margin-top:8px;">Change Password</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
