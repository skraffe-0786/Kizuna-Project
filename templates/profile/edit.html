{% extends 'base_app.html' %}

{% block title %}Edit Profile - Kizuna{% endblock %}

{% block content %}
<div class="edit-profile-page">
    <div class="page-header" style="margin-bottom:20px;">
        <a href="{% url 'profile' request.user.username %}" class="back-btn" title="Back">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12,19 5,12 12,5"/></svg>
        </a>
        <h2>Edit Profile</h2>
    </div>
    <form method="post" enctype="multipart/form-data" class="edit-form">
        {% csrf_token %}
        <div class="form-group">
            <label>Profile Picture</label>
            <div class="current-pic">
                {% if request.user.profile.profile_pic %}
                    <img src="{{ request.user.profile.profile_pic.url }}" class="edit-avatar" alt="">
                {% else %}
                    <div class="edit-avatar-placeholder">{{ request.user.username.0|upper }}</div>
                {% endif %}
            </div>
            {{ form.profile_pic }}
        </div>
        <div class="form-group">
            <label>Bio</label>
            {{ form.bio }}
        </div>
        <button type="submit" class="btn-post" style="width:100%">Save Changes</button>
    </form>
</div>
{% endblock %}
